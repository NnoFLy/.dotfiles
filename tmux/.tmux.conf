set -s escape-time 1

# set -g default-terminal "tmux-256color"
# set -as terminal-features ",*:RGB"

set -g default-terminal "tmux"

set -g base-index 1
set-option -g renumber-windows on
set-option -g focus-events on
set -gq allow-passthrough on
set -g visual-activity off
set -g extended-keys on
set -g extended-keys-format csi-u

# set -ga update-environment TERM
# set -ga update-environment TERM_PROGRAM

unbind C-b
set-option -g prefix C-q
bind-key C-q send-prefix

bind -T copy-mode-vi WheelUpPane   send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down

bind -T copy-mode WheelUpPane      send-keys -X scroll-up
bind -T copy-mode WheelDownPane    send-keys -X scroll-down

bind -r r source-file ~/.tmux.conf

bind -n C-M-f new-window -n "tmux-sessionizer" tmux-sessionizer
bind -n C-M-b new-window -n "btop" btop
bind -n C-M-g new-window -n "gitu" gitu
bind -n C-M-p new-window -n "pi" pi

set-window-option -g mode-keys vi
set -g mouse on
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

bind -n C-M-[ copy-mode
bind -n C-M-t choose-tree -s

bind -n C-M-o next
bind -n C-M-i prev
bind -n C-S-M-o swap-window -t +1\; select-window -t +1
bind -n C-S-M-i swap-window -t -1\; select-window -t -1
bind -n C-tab last

bind -n C-M-c neww -c "#{pane_current_path}"
bind -n C-M-v split-window -h -c "#{pane_current_path}"
bind -n C-M-s split-window -v -c "#{pane_current_path}"
bind -n C-M-x kill-pane
bind -n C-M-X detach-client
bind l switch-client -l

bind -n C-Tab last-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind C-k select-pane -U
bind C-j select-pane -D
bind C-h select-pane -L
bind C-l select-pane -R

set -g status-right "#(whoami)@#H | %a %H:%M"
set -g status-left-length 99
set -g status-right-length 99
set -g status-justify absolute-centre
set -g status-position top
set -g status-interval 60
setw -g mode-style 'fg=black bg=#dadada bold'
set -g status-style 'fg=#dadada bg=default'
